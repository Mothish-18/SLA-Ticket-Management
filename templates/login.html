<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Login | SLA Desk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-lg-4">

            <div class="card border-0 shadow-lg">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <i class="bi bi-headset display-4 text-primary"></i>

                        <h2 class="fw-bold mt-3">

                            SLA Desk

                        </h2>

                        <p class="text-muted">

                            Sign in to continue

                        </p>

                    </div>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">

                                Username

                            </label>

                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Password

                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   required>

                        </div>

                        <button class="btn btn-primary w-100">

                            Login

                        </button>

                    </form>
                    <p class="mt-3">

    Don't have an account?

    <a href="{% url 'register' %}">

        Register Here

    </a>

</p>


<div class="card-body">

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

       

    </form>


</div>



                    {% if messages %}

                        {% for message in messages %}

                        <div class="alert alert-danger mt-3">

                            {{ message }}

                        </div>

                        {% endfor %}

                    {% endif %}

                </div>

            </div>

        </div>

    </div>


</div>

</body>

</html>

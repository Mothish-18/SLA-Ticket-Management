{% extends 'base.html' %}

{% block content %}

<!-- Header -->

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold mb-1">
            <i class="bi bi-ticket-detailed-fill text-primary"></i>
            Create Ticket
        </h2>

        <p class="text-muted mb-0">
            Create a new support request and assign it to an engineer
        </p>

    </div>

    <a href="{% url 'ticket_list' %}"
       class="btn btn-outline-secondary">

        <i class="bi bi-arrow-left"></i>
        Back to Tickets

    </a>

</div>

<form method="POST">

    {% csrf_token %}

    <div class="card border-0 shadow-sm">

        <div class="card-header bg-white py-3">

            <h5 class="fw-bold mb-0">

                <i class="bi bi-pencil-square text-primary"></i>
                Ticket Details

            </h5>

        </div>

        <div class="card-body">

            <div class="row">

                <!-- Left Side -->

                <div class="col-lg-8">

                    <div class="mb-4">

                        <label class="form-label fw-semibold">

                            Ticket Title

                        </label>

                        {{ form.title }}

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">

                            Description

                        </label>

                        {{ form.description }}

                    </div>

                </div>

                <!-- Right Side -->

                <div class="col-lg-4">

                    <div class="mb-4">

                        <label class="form-label fw-semibold">

                            Priority

                        </label>

                        {{ form.priority }}

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">

                            Status

                        </label>

                        {{ form.status }}

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">

                            Assigned Engineer

                        </label>

                        {{ form.assigned_to }}

                    </div>

                </div>

            </div>

        </div>

        <div class="card-footer bg-white">

            <div class="d-flex justify-content-end gap-2">

                <a href="{% url 'ticket_list' %}"
                   class="btn btn-outline-secondary">

                    Cancel

                </a>

                <button type="submit"
                        class="btn btn-primary">

                    <i class="bi bi-check-circle"></i>
                    Create Ticket

                </button>

            </div>

        </div>

    </div>

</form>

{% endblock %}
